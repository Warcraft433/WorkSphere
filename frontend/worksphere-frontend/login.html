<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSphere – Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const t = localStorage.getItem('ws_theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-form-section">
            <div class="login-header">
                <h2><i class="fa-solid fa-layer-group"></i> WorkSphere ERP</h2>
                <p>Sign in to your account to continue</p>
            </div>
            <div id="loginError" class="error-msg" style="display:none"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="username" placeholder="Username or Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="login-options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary login-btn">Sign In</button>
            </form>
            <div class="login-footer">
                &copy; 2026 EMS. All rights reserved.
            </div>
        </div>
        <div class="login-image-section">
            <div class="illustration-placeholder">
                <!-- In a real app, an SVG or image would go here -->
                <i class="fa-solid fa-chart-line illustration-icon"></i>
                <h3>Manage Your Workforce Efficiently</h3>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
