<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS - Employees</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-users"></i> EMS
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Dashboard</a>
                <a href="employees.html" class="nav-item active"><i class="fa-solid fa-user-group"></i> Employees</a>
                <a href="departments.html" class="nav-item"><i class="fa-solid fa-building"></i> Departments</a>
                <a href="attendance.html" class="nav-item"><i class="fa-solid fa-calendar-check"></i> Attendance</a>
                <a href="leaves.html" class="nav-item"><i class="fa-solid fa-calendar-minus"></i> Leaves</a>
                <a href="payroll.html" class="nav-item"><i class="fa-solid fa-money-check-dollar"></i> Payroll</a>
                <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-bar"></i> Reports</a>
                <a href="documents.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Documents</a>
                <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Header -->
            <header class="top-header">
                <div class="header-title">
                    <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                    <h2>Employees</h2>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" placeholder="Search employees...">
                    </div>
                    <div class="user-profile">
                        <div class="avatar"><i class="fa-solid fa-user"></i></div>
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-area">
                <div class="page-header-actions">
                    <h3>Employee Directory</h3>
                    <button class="btn-primary" onclick="openAddEmployeeModal()"><i class="fa-solid fa-plus"></i> Add Employee</button>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Hire Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- Data populated by JS -->
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 20px;">Loading employees...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-controls" style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
                    <button class="btn-secondary" id="prevPageBtn" onclick="changePage(-1)" disabled>Previous</button>
                    <span id="pageInfo" style="align-self: center; font-weight: 500;">Page 1 of 1</span>
                    <button class="btn-secondary" id="nextPageBtn" onclick="changePage(1)" disabled>Next</button>
                </div>
            </main>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Employee</h2>
                <span class="close-btn" onclick="closeAddEmployeeModal()">&times;</span>
            </div>
            <form id="addEmployeeForm">
                <input type="hidden" id="empId" value="">
                <div id="formError" class="error-msg" style="display:none;"></div>
                
                <div class="form-row">
                    <div class="input-group-modal">
                        <label>First Name</label>
                        <input type="text" id="empFirstName" required>
                    </div>
                    <div class="input-group-modal">
                        <label>Last Name</label>
                        <input type="text" id="empLastName" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group-modal">
                        <label>Email</label>
                        <input type="email" id="empEmail" required>
                    </div>
                    <div class="input-group-modal">
                        <label>Phone</label>
                        <input type="text" id="empPhone" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group-modal">
                        <label>Hire Date</label>
                        <input type="date" id="empHireDate" required>
                    </div>
                    <div class="input-group-modal">
                        <label>Salary</label>
                        <input type="number" id="empSalary" step="0.01" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeAddEmployeeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveEmployeeBtn">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Action completed successfully</div>

    <script src="script.js"></script>
    <script src="employee.js"></script>
</body>
</html>
