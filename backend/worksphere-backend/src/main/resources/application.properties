spring.application.name=worksphere-backend

# ============================================
# H2 In-Memory Database (Portfolio Demo Mode)
# NOTE: All data resets on backend restart.
# For production, replace with a real DB config.
# ============================================
spring.datasource.url=jdbc:h2:mem:worksphere_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Hibernate 6.x dialect (Spring Boot 3+/4+)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Disable X-Frame-Options for H2 console
spring.h2.console.settings.trace=false

# Server
server.port=8080

# Logging
logging.level.com.worksphere=INFO
logging.level.org.springframework.security=WARN