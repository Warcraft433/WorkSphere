<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS - Documents</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            const t = localStorage.getItem('ws_theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-users"></i> EMS
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Dashboard</a>
                <a href="employees.html" class="nav-item"><i class="fa-solid fa-user-group"></i> Employees</a>
                <a href="departments.html" class="nav-item"><i class="fa-solid fa-building"></i> Departments</a>
                <a href="attendance.html" class="nav-item"><i class="fa-solid fa-calendar-check"></i> Attendance</a>
                <a href="leaves.html" class="nav-item"><i class="fa-solid fa-calendar-minus"></i> Leaves</a>
                <a href="payroll.html" class="nav-item"><i class="fa-solid fa-money-check-dollar"></i> Payroll</a>
                <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-bar"></i> Reports</a>
                <a href="documents.html" class="nav-item active"><i class="fa-solid fa-folder-open"></i> Documents</a>
                <a href="user-management.html" class="nav-item admin-only"><i class="fa-solid fa-users-gear"></i> User Management</a>
                <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Header -->
            <header class="top-header">
                <div class="header-title">
                    <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                    <h2>Document Center</h2>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" placeholder="Search documents...">
                    </div>
                    <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i><span>Dark Mode</span></button>
                    <div class="user-profile">
                        <div class="avatar"><i class="fa-solid fa-user"></i></div>
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-area">
                <div class="page-header-actions">
                    <h3>Uploaded Files</h3>
                    <button class="btn-primary" onclick="openDocumentModal()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Document</button>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Employee</th>
                                <th>Document Type</th>
                                <th>File Name / Path</th>
                                <th>Uploaded On</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="documentTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 20px;">Loading documents...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Upload Document Modal -->
    <div id="documentModal" class="modal">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header">
                <h2>Upload Document</h2>
                <span class="close-btn" onclick="closeDocumentModal()">&times;</span>
            </div>
            <form id="documentForm">
                <div class="modal-body" style="padding: 20px 25px;">
                    <div id="formError" class="error-msg" style="display:none;"></div>
                    
                    <div class="form-row">
                        <div class="input-group-modal">
                            <label>Select Employee</label>
                            <select id="docEmployee" required>
                                <option value="">Choose Employee...</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group-modal">
                            <label>Document Type</label>
                            <select id="docType" required>
                                <option value="ID Proof">ID Proof</option>
                                <option value="Employment Contract">Employment Contract</option>
                                <option value="Resume/CV">Resume/CV</option>
                                <option value="Tax Form">Tax Form</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group-modal">
                            <label>Choose File</label>
                            <input type="file" id="docFile" style="padding: 8px 12px;" required>
                        </div>
                    </div>

                    <div class="modal-footer" style="padding-top: 15px; margin-top: 10px;">
                        <button type="button" class="btn-secondary" onclick="closeDocumentModal()">Cancel</button>
                        <button type="submit" class="btn-primary" id="saveDocBtn"><i class="fa-solid fa-upload"></i> Upload</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Action completed successfully</div>

    <script src="script.js"></script>
    <script src="documents.js"></script>
</body>
</html>
